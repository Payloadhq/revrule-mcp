name: consumer-compatibility
on:
  push:
    branches:
      - 'test/external-simulate-event-contract-20261016'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/external-simulate-event.test.cjs
